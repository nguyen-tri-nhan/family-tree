name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and previous tag
        id: pkg
        run: |
          echo "version=$(node -p "require('./frontend/packages/electron-app/package.json').version")" >> $GITHUB_OUTPUT
          # Lấy tag mới nhất hiện có (= tag trước khi release này được tạo)
          PREV=$(git tag --sort=-version:refname | head -1)
          echo "prev_tag=${PREV}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          previous_tag_name: ${{ steps.pkg.outputs.prev_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-electron:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: dist-windows
            artifact-path: frontend/packages/electron-app/release/*.exe
          - os: macos-latest
            artifact-name: dist-macos
            artifact-path: frontend/packages/electron-app/release/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build & package
        run: |
          npx electron-vite build
          npx electron-builder --publish never
        working-directory: frontend/packages/electron-app

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  upload-release:
    needs: [create-release, build-electron]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
