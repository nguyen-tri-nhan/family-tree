<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="male" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="female" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="child" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App icon background (rounded square) -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle inner glow on background -->
  <rect x="1" y="1" width="510" height="510" rx="109" fill="none"
        stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- ── EDGES ── drawn first (behind nodes) -->

  <!-- Marriage bar between parents -->
  <line x1="222" y1="168" x2="290" y2="168"
        stroke="rgba(255,255,255,0.55)" stroke-width="13" stroke-linecap="round"/>

  <!-- Vertical stem down from couple midpoint -->
  <line x1="256" y1="168" x2="256" y2="286"
        stroke="rgba(255,255,255,0.55)" stroke-width="13" stroke-linecap="round"/>

  <!-- Horizontal bracket connecting the two children -->
  <line x1="162" y1="286" x2="350" y2="286"
        stroke="rgba(255,255,255,0.55)" stroke-width="13" stroke-linecap="round"/>

  <!-- Drop line to left child -->
  <line x1="162" y1="286" x2="162" y2="322"
        stroke="rgba(255,255,255,0.55)" stroke-width="13" stroke-linecap="round"/>

  <!-- Drop line to right child -->
  <line x1="350" y1="286" x2="350" y2="322"
        stroke="rgba(255,255,255,0.55)" stroke-width="13" stroke-linecap="round"/>

  <!-- ── PARENT NODES ── -->

  <!-- Male parent (left) -->
  <circle cx="162" cy="168" r="63" fill="url(#male)"/>
  <!-- Head -->
  <circle cx="162" cy="152" r="19" fill="none" stroke="white" stroke-width="7"/>
  <!-- Shoulders -->
  <path d="M 134 191 C 134 169 190 169 190 191"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>

  <!-- Female parent (right) -->
  <circle cx="350" cy="168" r="63" fill="url(#female)"/>
  <!-- Head -->
  <circle cx="350" cy="152" r="19" fill="none" stroke="white" stroke-width="7"/>
  <!-- Shoulders -->
  <path d="M 322 191 C 322 169 378 169 378 191"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>

  <!-- ── CHILD NODES ── -->

  <!-- Child 1 (left) -->
  <circle cx="162" cy="374" r="52" fill="url(#child)"/>
  <!-- Head -->
  <circle cx="162" cy="360" r="15" fill="none" stroke="white" stroke-width="6"/>
  <!-- Shoulders -->
  <path d="M 138 393 C 138 374 186 374 186 393"
        fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Child 2 (right) -->
  <circle cx="350" cy="374" r="52" fill="url(#child)"/>
  <!-- Head -->
  <circle cx="350" cy="360" r="15" fill="none" stroke="white" stroke-width="6"/>
  <!-- Shoulders -->
  <path d="M 326 393 C 326 374 374 374 374 393"
        fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Tiny accent dots at edge junctions for polish -->
  <circle cx="256" cy="286" r="6" fill="rgba(255,255,255,0.35)"/>
</svg>
